[package]
name = "skyios-tool"
version.workspace = true
publish.workspace = true
edition = "2021"

[[bin]]
name = "skyios"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
flate2 = "1"
libc = "0.2"
plist = "1"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = "0.5"
