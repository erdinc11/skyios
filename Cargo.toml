[workspace]
resolver = "2"
members = ["skyios-kernel", "skyios-shim", "skyios-tool"]
default-members = ["skyios-tool"]

[workspace.package]
version = "0.1.0"
publish = false

[profile.release]
opt-level = 2
panic = "abort"
debug = 1
codegen-units = 1
lto = true

[profile.release.package.skyios-tool]
opt-level = 3
debug = 0
strip = true

[profile.dev]
panic = "abort"
